name: dictation
description: Dictado continuo nativo (Apple Speech) para Copiloto Juntas.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: DictationPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: DictationPlugin
        sharedDarwinSource: true
